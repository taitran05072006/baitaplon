name: taitran

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci
    cancel-in-progress: false

jobs:
    test:
        name: test backend and build frontend
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_DATABASE: baitaplon
                    MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD}"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10
        steps:
            -   name: Checkout code
                uses: actions/checkout@v3
            -   name: setup Java
                uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: 25
                    cache: maven
            -   name: test backend
                working-directory: ./demo
                env:
                    DB_HOST: localhost
                    DB_PORT: 3306
                    DB_NAME: baitaplon
                    DB_USERNAME: root
                    DB_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
                run: ./mvnw -B test

            -   name: setup Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: 20
                    cache: npm
                    cache-dependency-path: ./frontend/package-lock.json
            -   name: build frontend
                working-directory: ./frontend
                run: |
                    npm ci
                    npm run build

    public:
        name: build and deploy images
        needs: test
        if: github.event_name == 'push'
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: login to DockerHub
                uses: docker/login-action@v3
                with:
                    username: ${{ secrets.DOCKER_USERNAME }}
                    password: ${{ secrets.DOCKERHUB_TOKEN }}

            -   name: setup Docker Buildx
                uses: docker/setup-buildx-action@v3

            -   name: build and push images
                uses: docker/build-push-action@v6
                with:
                    context: ./demo
                    push: true
                    platforms: linux/amd64,linux/arm64
                    tags: |
                        ${{ secrets.DOCKER_USERNAME }}/backend:latest
                        ${{ secrets.DOCKER_USERNAME }}/backend:${{ github.sha }}
            -   name: build and push frontend images
                uses: docker/build-push-action@v6
                with:
                    context: ./frontend
                    push: true
                    platforms: linux/amd64, linux/arm64
                    tags: |
                        ${{ secrets.DOCKER_USERNAME }}/frontend:latest
                        ${{ secrets.DOCKER_USERNAME }}/frontend:${{ github.sha }}

    deploy:
        name: Deploy to Ubuntu VM
        needs: public
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest

        environment:
            name: production
            url: http://ontap.taitran.me

        steps:
      # 1. Checkout đúng commit kích hoạt workflow
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                ref: ${{ github.sha }}

      # 2. Kết nối Tailscale
            - name: Connect to Tailscale
              uses: tailscale/github-action@v3
              with:
                oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                tags: tag:ci

      # 3. Tạo thư mục đích trên Ubuntu
            - name: Prepare deployment directory
              uses: appleboy/ssh-action@v1.2.0
              with:
                host: ${{ secrets.SERVER_HOST }}
                username: ${{ secrets.SERVER_USER }}
                key: ${{ secrets.SERVER_SSH_KEY }}
                passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
                script: |
                    set -eu
                    sudo mkdir -p /opt/ontap/nginx
                    sudo chown -R "${{ secrets.SERVER_USER }}" /opt/ontap

            - name: Copy deployment files
              uses: appleboy/scp-action@v1
              with:
                host: ${{ secrets.SERVER_HOST }}
                username: ${{ secrets.SERVER_USER }}
                key: ${{ secrets.SERVER_SSH_KEY }}
                passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
                source: "Compose.yaml,nginx/nginx.conf"
                target: "/opt/ontap"
                overwrite: true

      # 5. SSH vào Ubuntu và triển khai
            - name: Deploy application
              uses: appleboy/ssh-action@v1.2.0
              with:
                host: ${{ secrets.SERVER_HOST }}
                username: ${{ secrets.SERVER_USER }}
                key: ${{ secrets.SERVER_SSH_KEY }}
                passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
                script: |
                    set -eu

                    cd /opt/ontap

                    # Sử dụng đúng tag image của commit hiện tại
                    export IMAGE_TAG="${{ github.sha }}"

                    # Kiểm tra cấu hình Docker Compose
                    docker compose --env-file .env -f Compose.yaml config -q

                    # Tải các image đã được GitHub Actions build và push
                    docker compose --env-file .env -f Compose.yaml pull

                    # Khởi động/cập nhật các container
                    docker compose --env-file .env -f Compose.yaml up \
                    --detach \
                    --remove-orphans \
                    --pull never \
                    --no-build

                    # Kiểm tra cấu hình Nginx trong container
                    docker compose --env-file .env -f Compose.yaml exec -T nginx nginx -t

                    # Reload Nginx
                    docker compose --env-file .env -f Compose.yaml exec -T nginx nginx -s reload

                    # Health check
                    attempt=1

                    while [ "$attempt" -le 24 ]; do
                    if curl --fail --silent \
                        --connect-timeout 5 --max-time 10 \
                        http://localhost:8085/ >/dev/null 2>&1 \
                        &&
                        curl --fail --silent \
                        --connect-timeout 5 --max-time 10 \
                        http://localhost:8080/api/actuator/health >/dev/null 2>&1; then

                        echo "All services are healthy."
                        exit 0
                    fi

                    echo "Health check attempt $attempt/24 failed."

                    sleep 5
                    attempt=$((attempt + 1))
                    done

                    echo "Deployment failed."

                    docker compose --env-file .env -f Compose.yaml ps
                    docker compose --env-file .env -f Compose.yaml logs --tail=100

                    exit 1