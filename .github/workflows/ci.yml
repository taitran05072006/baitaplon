
name: taitran-ci-cd

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

# Tránh nhiều workflow cùng triển khai đồng thời.
concurrency:
  group: taitran-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test backend and build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_DATABASE: baitaplon
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      # Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: demo/pom.xml

      # Backend tests
      - name: Test backend
        working-directory: ./demo
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: baitaplon
          DB_USERNAME: root
          DB_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}

        run: |
          chmod +x ./mvnw
          ./mvnw -B test

      # Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Frontend build
      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build


  # ==========================================
  # JOB 2: BUILD AND PUSH DOCKER IMAGES
  # ==========================================
  public:
    name: Build and push Docker images

    needs: test

    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')

    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # Docker Hub login
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Backend image
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./demo
          push: true
          platforms: linux/amd64,linux/arm64

          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/backend:latest

          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # Frontend image
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64,linux/arm64

          tags: |
            ${{ secrets.DOCKER_USERNAME }}/frontend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/frontend:latest

          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend


  deploy:
    name: Deploy to Ubuntu VM
    needs: public

    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')

    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: production
      url: http://ontap.taitran.me

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Configure SSH and run Ansible
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_PASSPHRASE: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          ANSIBLE_BECOME_PASSWORD: ${{ secrets.SERVER_SUDO_PASSWORD }}

        run: |
          set -eu
          export ANSIBLE_CONFIG="$GITHUB_WORKSPACE/ansible/ansible.cfg"
          export ANSIBLE_ROLES_PATH="$GITHUB_WORKSPACE/ansible/roles"
          cd "$GITHUB_WORKSPACE/ansible"

          : "${SERVER_HOST:?SERVER_HOST secret is required}"
          : "${SERVER_USER:?SERVER_USER secret is required}"
          : "${SERVER_SSH_KEY:?SERVER_SSH_KEY secret is required}"
          : "${DOCKERHUB_USERNAME:?DOCKER_USERNAME secret is required}"
          : "${DOCKERHUB_TOKEN:?DOCKERHUB_TOKEN secret is required}"
          : "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD secret is required}"
          : "${ANSIBLE_BECOME_PASSWORD:?SERVER_SUDO_PASSWORD secret is required}"

          # Prepare SSH key
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Start SSH agent
          eval "$(ssh-agent -s)"

          # Load passphrase-protected private key
          cat > ~/.ssh/askpass.sh <<'EOF'
          #!/bin/sh
          printf '%s\n' "$SERVER_SSH_PASSPHRASE"
          EOF

          chmod 700 ~/.ssh/askpass.sh

          export SSH_ASKPASS="$HOME/.ssh/askpass.sh"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=:0

          setsid -w ssh-add ~/.ssh/deploy_key </dev/null

          echo "Checking sudo access on deployment host..."
          if ! printf '%s\n' "$ANSIBLE_BECOME_PASSWORD" | \
            ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              "$SERVER_USER@$SERVER_HOST" "sudo -S -k -v"; then
            echo "ERROR: SSH authentication or sudo validation failed."
            echo "Verify SERVER_HOST, SERVER_USER, SERVER_SSH_KEY, and SERVER_SUDO_PASSWORD."
            exit 1
          fi

          # Create Ansible inventory
          mkdir -p inventory

          cat > inventory/hosts.yml <<EOF
          all:
            children:
              app:
                hosts:
                  ontap:
                    ansible_host: "${SERVER_HOST}"
                    ansible_user: "${SERVER_USER}"
                    ansible_connection: ssh
          EOF

          # Run Ansible deployment
          ansible-playbook \
            -i inventory/hosts.yml \
            playbooks/deploy.yml \
            -e "image_tag=${IMAGE_TAG}" \
            -e "ansible_become_password=${ANSIBLE_BECOME_PASSWORD}"
