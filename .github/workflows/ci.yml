name: taitran

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci
    cancel-in-progress: false

jobs:
    test:
        name: test backend and build frontend
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_DATABASE: baitaplon
                    MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD}"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10
        steps:
            -   name: Checkout code
                uses: actions/checkout@v3
            -   name: setup Java
                uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: 25
                    cache: maven
            -   name: test backend
                working-directory: ./demo
                env:
                    DB_HOST: localhost
                    DB_PORT: 3306
                    DB_NAME: baitaplon
                    DB_USERNAME: root
                    DB_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
                run: ./mvnw -B test

            -   name: setup Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: 20
                    cache: npm
                    cache-dependency-path: ./frontend/package-lock.json
            -   name: build frontend
                working-directory: ./frontend
                run: |
                    npm ci
                    npm run build

    public:
        name: build and deploy images
        needs: test
        if: github.event_name == 'push'
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: login to DockerHub
                uses: docker/login-action@v3
                with:
                    username: ${{ secrets.DOCKER_USERNAME }}
                    password: ${{ secrets.DOCKERHUB_TOKEN }}

            -   name: setup Docker Buildx
                uses: docker/setup-buildx-action@v3

            -   name: build and push images
                uses: docker/build-push-action@v6
                with:
                    context: ./demo
                    push: true
                    platforms: linux/amd64,linux/arm64
                    tags: |
                        ${{ secrets.DOCKER_USERNAME }}/backend:latest
                        ${{ secrets.DOCKER_USERNAME }}/backend:${{ github.sha }}
            -   name: build and push frontend images
                uses: docker/build-push-action@v6
                with:
                    context: ./frontend
                    push: true
                    platforms: linux/amd64, linux/arm64
                    tags: |
                        ${{ secrets.DOCKER_USERNAME }}/frontend:latest
                        ${{ secrets.DOCKER_USERNAME }}/frontend:${{ github.sha }}

    deploy:
        name: deploy to ubuntu VM
        needs: public
        runs-on: ubuntu-latest
        environment:
            name: production
            url: http://ontap.taitran.me

        steps:
            -   name: Connect to Tailscale
                uses: tailscale/github-action@v3
                with:
                    oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                    oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                    tags: tag:ci

            -   name: SSH to VM
                uses: appleboy/ssh-action @v1.2.0
                with:
                    host: ${{ secrets.SERVER_HOST }}
                    username: ${{ secrets.SERVER_USER }}
                    key: ${{ secrets.SERVER_SSH_KEY }}
                    passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
                    script_stop: true
                    script: |
                        set -eu
                        sudo mkdir -p /opt/ontap

                        sudo chown -R ${{ secrets.SERVER_USER }} /opt/ontap

                        cd /opt/ontap
                        if [ ! -d .git ]; then
                            git init
                            git remote add origin https://github.com/taitran05072006/baitaplon.git
                        fi

                        git fetch --depth=1 origin "${{ github.sha }}"

                        mkdir -p nginx
                        git show FETCH_HEAD:Compose.yaml > Compose.yaml
                        git show FETCH_HEAD:nginx/nginx.conf > nginx/nginx.conf

                        export IMAGE_TAG="${{ github.sha }}"
                        docker compose --env-file .env -f Compose.yaml pull
                        docker compose --env-file .env -f Compose.yaml up \
                            --detach \
                            --remove-orphans \
                            --pull never \
                            --no-build

                        docker compose exec nginx nginx -t
                        docker compose exec nginx nginx -s reload

                        for attempt in {1..24}; do
                            if curl --fail --silent --show-error \
                                --connect-timeout 5 --max-time 10 \
                                http://localhost:8085/ >/dev/null \

                                &&

                            curl --fail --silent --show-error \
                                --connect-timeout 5 --max-time 10 \
                                http://localhost:8080/api/actuator/health >/dev/null; then
                                echo "All services are healthy."
                                exit 0
                            fi

                            sleep 5
                        done

                        echo "Deployment failed: services did not become healthy within the expected time frame."
                        docker compose --env-file .env -f Compose.yaml ps
                        docker compose --env-file .env -f Compose.yaml logs --tail=100
                        exit 1











