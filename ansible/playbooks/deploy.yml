---
- name: Bootstrap Python for Ansible
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Install Python 3 on Debian-based hosts
      ansible.builtin.raw: |
        test -x /usr/bin/python3 || (
          apt-get update &&
          DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-apt
        )
      changed_when: false

- name: Provision and configure Docker
  hosts: all
  become: true
  roles:
    - docker
    - deploy
    - firewall
    - common