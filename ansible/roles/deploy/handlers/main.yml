---
- name: Restart Application
  ansible.builtin.shell:
    cmd: docker compose --env-file .env -f compose.yaml pull && docker compose --env-file .env -f compose.yaml --detach --remove-orphans up
    chdir: "{{ app_dir }}"
    executable: /bin/bash
  changed_when: true

- name: Restart host Nginx
  ansible.builtin.service:
    name: nginx
    state: restarted